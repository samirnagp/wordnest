<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TemplateHub – Word Templates</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#161a24;--mu:#646b7b;--ac:#2b579a;--acx:#fff;--bd:#e2e5ee;--soft:#e8eefa;--dg:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1b1e27;--tx:#eef0f6;--mu:#9aa1b2;--ac:#7ea6ee;--acx:#101522;--bd:#2c303c;--soft:#222a3d;--dg:#ff8787}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1b1e27;--tx:#eef0f6;--mu:#9aa1b2;--ac:#7ea6ee;--acx:#101522;--bd:#2c303c;--soft:#222a3d;--dg:#ff8787}
html{scroll-padding-top:70px}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);z-index:9}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
nav{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--ac);color:var(--acx);display:grid;place-items:center;font-style:normal;font-size:16px}
.hero{padding:38px 0 18px}
h1{font-size:clamp(28px,5.5vw,44px);line-height:1.12;margin:0 0 10px;letter-spacing:-1px}
.hero p{margin:0;color:var(--mu);max-width:560px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:18px 0}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:30px 16px;text-align:center;color:var(--mu);cursor:pointer;transition:.15s}
.drop:hover,.drop.on{border-color:var(--ac);background:var(--soft)}
.drop b{color:var(--tx);display:block;font-size:17px;margin-bottom:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
select,input[type=search]{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0}
input[type=search]{flex:1 1 200px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:transparent;color:var(--dg);border:1px solid var(--bd)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-top:12px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip.a{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;gap:12px;align-items:center}
.ico{flex:none;width:44px;height:44px;border-radius:10px;background:var(--soft);color:var(--ac);display:grid;place-items:center;font-weight:800;font-size:20px}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--mu);font-size:13px}
.tag{display:inline-block;background:var(--soft);color:var(--ac);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600;margin-right:6px}
.acts{display:flex;gap:8px}.acts .btn{flex:1;padding:8px 10px;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:40px 10px;border:1px dashed var(--bd);border-radius:14px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:92%;text-align:center;z-index:20}
#toast.s{opacity:1}
footer{color:var(--mu);font-size:13px;text-align:center;padding:26px 0 40px}
</style>
</head>
<body>
<header><div class="wrap"><nav>
<div class="logo"><i>W</i>TemplateHub</div>
<button class="btn g" id="theme" aria-label="Toggle theme">Theme</button>
</nav></div></header>

<main class="wrap">
<div class="hero">
<h1>Your Word templates,<br>always at hand.</h1>
<p>Upload letters, invoices, résumés and contracts once. Search, filter and download them whenever you need.</p>
</div>

<section class="panel" aria-label="Upload">
<div class="drop" id="drop" tabindex="0" role="button"><b>Tap to choose Word files</b>or drag and drop them here (.docx, .dotx, .doc · up to 15 MB each)</div>
<input type="file" id="inp" accept=".docx,.dotx,.doc" multiple hidden>
<div class="row">
<select id="cat" aria-label="Category"></select>
<button class="btn" id="up" disabled>Upload</button>
<span class="meta" id="sel"></span>
</div>
</section>

<section aria-label="Library">
<div class="row" style="margin-top:0"><input type="search" id="q" placeholder="Search templates…" aria-label="Search"><span class="meta" id="count"></span></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
</section>
</main>
<footer><div class="wrap">Templates are stored privately in this browser.</div></footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s);
const CATS=['Letters','Invoices','Résumés','Contracts','Reports','Other'];
const MAX=15*1024*1024,OK=/\.(docx|dotx|doc)$/i;
let items=[],cat='All',q='',picked=[],db=null,mem=false,delArm=null;

/* ---------- storage (IndexedDB, in-memory fallback) ---------- */
function openDb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('word-templates',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
const tx=(m,fn)=>new Promise((res,rej)=>{const t=db.transaction('f',m);const r=fn(t.objectStore('f'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
async function init(){
  try{db=await openDb();items=(await tx('readonly',s=>s.getAll())||[])}
  catch(e){mem=true;toast('Storage is unavailable, so templates will last only for this visit.')}
  render();
}

/* ---------- helpers ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('s'),3200)}
const size=n=>n<1048576?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(1)+' MB';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ext=n=>(n.match(/\.[^.]+$/)||[''])[0].toLowerCase();

/* ---------- upload ---------- */
function pick(list){
  const f=[...list],bad=f.filter(x=>!OK.test(x.name)),big=f.filter(x=>x.size>MAX);
  picked=f.filter(x=>OK.test(x.name)&&x.size<=MAX);
  if(bad.length)toast('Only Word files (.docx, .dotx, .doc) are allowed.');
  else if(big.length)toast('Files must be 15 MB or smaller.');
  $('#sel').textContent=picked.length?picked.length+' file'+(picked.length>1?'s':'')+' ready':'';
  $('#up').disabled=!picked.length;
}
$('#drop').onclick=()=>$('#inp').click();
$('#drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#inp').click()}};
$('#inp').onchange=e=>pick(e.target.files);
['dragover','dragenter'].forEach(v=>$('#drop').addEventListener(v,e=>{e.preventDefault();$('#drop').classList.add('on')}));
['dragleave','drop'].forEach(v=>$('#drop').addEventListener(v,e=>{e.preventDefault();$('#drop').classList.remove('on')}));
$('#drop').addEventListener('drop',e=>pick(e.dataTransfer.files));
$('#up').onclick=async()=>{
  $('#up').disabled=true;let n=0;
  for(const f of picked){
    const rec={id:Date.now()+'-'+Math.random().toString(36).slice(2,7),name:f.name,category:$('#cat').value,size:f.size,added:Date.now(),blob:f};
    try{if(!mem)await tx('readwrite',s=>s.put(rec));items.unshift(rec);n++}
    catch(e){toast('Could not save '+f.name+'. Browser storage may be full.')}
  }
  picked=[];$('#inp').value='';$('#sel').textContent='';
  if(n)toast(n+' template'+(n>1?'s':'')+' uploaded');
  render();
};

/* ---------- download ---------- */
async function dl(it){
  let d=null;
  try{d=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
  if(d){
    try{await d.save({filename:it.name,data:it.blob});toast('Saved '+it.name)}
    catch(e){toast(e&&e.code==='declined'?'Download cancelled.':e&&e.code==='rejected_extension'?'This viewer can only save .docx files. Open the site on its own page to download '+ext(it.name)+' files.':'The download could not start.')}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(it.blob);a.download=it.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function del(id){
  try{if(!mem)await tx('readwrite',s=>s.delete(id));items=items.filter(x=>x.id!==id);toast('Template deleted')}
  catch(e){toast('Could not delete it.')}
  delArm=null;render();
}

/* ---------- render ---------- */
function render(){
  $('#chips').innerHTML=['All',...CATS].map(c=>`<button class="chip ${c===cat?'a':''}" data-c="${c}">${c}</button>`).join('');
  const list=items.filter(i=>(cat==='All'||i.category===cat)&&i.name.toLowerCase().includes(q));
  $('#count').textContent=items.length?list.length+' of '+items.length:'';
  $('#grid').innerHTML=list.map(i=>`<div class="card">
<div class="top"><div class="ico">W</div><div style="min-width:0"><div class="nm" title="${esc(i.name)}">${esc(i.name)}</div>
<div class="meta"><span class="tag">${esc(i.category)}</span>${size(i.size)} · ${new Date(i.added).toLocaleDateString()}</div></div></div>
<div class="acts"><button class="btn" data-dl="${i.id}">Download</button>
<button class="btn d" data-del="${i.id}">${delArm===i.id?'Confirm?':'Delete'}</button></div></div>`).join('');
  if(!list.length)$('#grid').innerHTML=`<div class="empty" style="grid-column:1/-1">${items.length?'No templates match your search.':'No templates yet. Upload your first Word file above.'}</div>`;
}
$('#chips').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
$('#grid').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.dl)dl(items.find(x=>x.id===b.dataset.dl));
  if(b.dataset.del){if(delArm===b.dataset.del)del(b.dataset.del);else{delArm=b.dataset.del;render();setTimeout(()=>{if(delArm){delArm=null;render()}},3500)}}
};
$('#cat').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
init();
</script>
</body>
</html>
